name: openclaw-mission-control

# Supabase-backed deployment.
#
# This compose file removes the local Postgres container and points the
# backend at Supabase Cloud via `DATABASE_URL`. Local Redis stays for the
# RQ webhook-worker queue. All service ports are bound to loopback only —
# external access goes through a reverse proxy (Cloudflare Tunnel in our
# production deploy).
#
# Mandatory env vars (see .env.example):
#   DATABASE_URL                       supabase pooler URI (port 6543)
#   SUPABASE_URL / SUPABASE_JWT_SECRET supabase project + jwt secret
#   SUPABASE_SERVICE_ROLE_KEY          backend-only, never in frontend env
#   GATEWAY_TOKEN_ENCRYPTION_KEY       openssl rand -base64 32
#   NEXT_PUBLIC_SUPABASE_URL           = SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_ANON_KEY      supabase anon key (safe in browser)
#   BASE_URL                           public URL of the deployment
#   CORS_ORIGINS                       comma-separated allowlist
#   AUTH_MODE                          must be `supabase` for this compose

services:
  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - path: ./backend/.env
        required: false
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGINS: ${CORS_ORIGINS}
      # Boot-time DDL against Supabase Cloud is irreversible from the panel
      # side. Default to off; the operator runs `alembic upgrade head`
      # explicitly when applying migrations.
      DB_AUTO_MIGRATE: ${DB_AUTO_MIGRATE:-false}
      AUTH_MODE: ${AUTH_MODE:-supabase}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GATEWAY_TOKEN_ENCRYPTION_KEY: ${GATEWAY_TOKEN_ENCRYPTION_KEY}
      BASE_URL: ${BASE_URL}
      RQ_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
    ports:
      # Loopback only — public traffic enters via the upstream reverse proxy.
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks:
      # `openclaw_net` (declared below as external) attaches the backend to
      # the OpenClaw gateway's compose network so the gateway is reachable by
      # service alias (`openclaw:64931`) without exposing the gateway on the
      # host. Set `OPENCLAW_NETWORK_NAME` if your OpenClaw compose project
      # uses a different network name.
      - default
      - openclaw_net

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
        NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-supabase}
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    env_file:
      - path: ./frontend/.env
        required: false
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-auto}
      NEXT_PUBLIC_AUTH_MODE: ${AUTH_MODE:-supabase}
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    depends_on:
      - backend
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    develop:
      watch:
        - action: rebuild
          path: ./frontend/src
        - action: rebuild
          path: ./frontend/package.json
        - action: rebuild
          path: ./frontend/package-lock.json
        - action: rebuild
          path: ./frontend/next.config.ts
        - action: rebuild
          path: ./frontend/postcss.config.js
        - action: rebuild
          path: ./frontend/tailwind.config.cjs
        - action: rebuild
          path: ./frontend/tsconfig.json

  webhook-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "scripts/rq-docker", "worker"]
    env_file:
      - path: ./backend/.env
        required: false
    depends_on:
      redis:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      AUTH_MODE: ${AUTH_MODE:-supabase}
      LOCAL_AUTH_TOKEN: ${LOCAL_AUTH_TOKEN:-}
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      GATEWAY_TOKEN_ENCRYPTION_KEY: ${GATEWAY_TOKEN_ENCRYPTION_KEY}
      BASE_URL: ${BASE_URL}
      RQ_REDIS_URL: redis://redis:6379/0
      RQ_QUEUE_NAME: ${RQ_QUEUE_NAME:-default}
      RQ_DISPATCH_THROTTLE_SECONDS: ${RQ_DISPATCH_THROTTLE_SECONDS:-2.0}
      RQ_DISPATCH_MAX_RETRIES: ${RQ_DISPATCH_MAX_RETRIES:-3}
    restart: unless-stopped

# Network definitions.
# `default` enables IPv6 for the Supabase Cloud DB host (whose A record
# does not resolve from the AWS regions Docker uses by default on some
# hosts; Supabase always publishes AAAA).
# `openclaw_net` is the external compose network of the local OpenClaw
# gateway deployment; attaching the backend here lets it reach the gateway
# by service alias (`openclaw:64931`) without exposing it on the host.
networks:
  default:
    enable_ipv6: true
    ipam:
      config:
        - subnet: 172.30.0.0/16
        - subnet: fd00:dead:beef::/64
  openclaw_net:
    name: openclaw-kozw_default
    external: true
